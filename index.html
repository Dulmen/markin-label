<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Markin">
<meta name="theme-color" content="#E8E2DB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17110F" media="(prefers-color-scheme: dark)">
<meta name="description" content="Etichette Vinted sul foglio Markin A465">
<title>Markin</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/wle2ags.css">
<link rel="stylesheet" href="css/app.css?v=2.0.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script type="module" src="js/app.js?v=2.0.0"></script>
</head>
<body>
<div class="luce" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="testa">
  <span class="marchio">Markin</span>
  <span class="sotto">A465 · 99 × 139</span>
  <nav class="pager" aria-label="Fogli">
    <button class="freccia" id="prec" aria-label="Foglio precedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span id="pagerTesto" aria-live="polite">Foglio 1 di 1</span>
    <button class="freccia" id="succ" aria-label="Foglio successivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </nav>
</header>

<main class="scena" id="scena">
  <div class="fogli" id="fogli"><div class="foglio entra" data-f="0"><div class="spazio" data-s="0" tabindex="0" role="button" style="left:2.857143%;top:2.356902%;width:47.142857%;height:46.801347%"></div><div class="spazio" data-s="1" tabindex="0" role="button" style="left:50%;top:2.356902%;width:47.142857%;height:46.801347%"></div><div class="spazio" data-s="2" tabindex="0" role="button" style="left:2.857143%;top:50.841751%;width:47.142857%;height:46.801347%"></div><div class="spazio" data-s="3" tabindex="0" role="button" style="left:50%;top:50.841751%;width:47.142857%;height:46.801347%"></div></div></div>
</main>
<div class="strato" id="strato" aria-hidden="true"></div>

<nav class="barra vetro" id="barra" aria-label="Azioni">
  <button class="btn" id="aggiungi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lungo">Aggiungi PDF</span></button>
  <button class="btn solo-largo" id="svuota" hidden>Svuota</button>
  <button class="btn solo-largo" id="nuovo" hidden>Foglio nuovo</button>
  <button class="btn solo-largo" id="ristampa" hidden>Ristampa</button>
  <span class="sep" hidden></span>
  <button class="btn solo-largo" id="scarica" hidden>Scarica</button>
  <button class="btn icona solo-telefono" id="altro" aria-label="Altro" aria-haspopup="menu" hidden><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  <button class="btn primario" id="stampa" hidden><span class="testo">Stampa</span><span class="conto"></span></button>
</nav>
<div class="menu vetro" id="menu" role="menu" hidden>
  <button role="menuitem" data-fa="ristampa">Ristampa</button>
  <button role="menuitem" data-fa="nuovo">Foglio nuovo</button>
  <button role="menuitem" data-fa="svuota">Svuota</button>
</div>

<div class="toast vetro" id="toast" role="status" aria-live="polite"><span></span><button type="button" hidden>Annulla</button></div>
<div class="cala" id="cala" hidden><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>Lascia i PDF</div></div>
<input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
<script>
  // Termina arriva dal kit Adobe: finché non c'è, il marchio resta nel font di sistema invece di sparire
  if (document.fonts) document.fonts.load('600 15px termina').then((f) => { if (f.length) document.documentElement.classList.add('termina'); }).catch(() => {});
</script>

<div class="velo" id="velo" hidden></div>
<section class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitolo" hidden>
  <header><h2 id="editorTitolo">Ritaglia</h2><span id="editorNome"></span><canvas id="editorMini" class="mini" aria-hidden="true"></canvas><button class="btn icona" id="editorChiudi" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="tela" id="tela"></div>
  <footer>
    <button class="btn" id="editorAuto">Automatico</button>
    <button class="btn" id="editorPagina">Pagina intera</button>
    <button class="btn" id="editorRuota"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>Ruota</button>
    <button class="btn primario" id="editorFatto">Fatto</button>
  </footer>
</section>
</body>
</html>
